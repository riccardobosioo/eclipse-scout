<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="app.title">Eclipse Scout — mappa</title>
<script src="i18n.js?v=20260812-1"></script>
<script src="analytics.js?v=20260812-4" data-surface="app" data-app-version="2026.08.12.4"></script>
<style>
  :root {
    --void: #06070c; --night: rgba(14,17,25,.94); --raise: #1a2030; --edge: rgba(255,255,255,.14);
    --corona: #f3f1ea; --dim: #939ab0; --amber: #ffa227; --amber-ink: #150d02; --totality: #ff5252;
    --mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--void); color: var(--corona); font: 15px/1.45 var(--sans); overscroll-behavior: none; }
  /* Maps riscrive lo style inline del container (position:relative): l'ancoraggio
     al viewport deve stare su un wrapper esterno, altrimenti il pano collassa a 0px. */
  #panoWrap { position: fixed; inset: 0; }
  #pano { width: 100%; height: 100%; background: #06070c; }
  #overlay { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

  /* ---------- Chip di stato (in alto, sottile) ---------- */
  #status {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    z-index: 6; display: flex; align-items: center; gap: 8px;
    background: var(--night); border: 1px solid var(--edge); border-radius: 999px;
    padding: 7px 14px; backdrop-filter: blur(10px);
    font: 600 13px/1 var(--sans); white-space: nowrap;
    max-width: calc(100vw - 100px); overflow: hidden;
  }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: none; }
  #status.is-total .dot { background: var(--totality); box-shadow: 0 0 10px var(--totality); }
  #status.is-out .dot { background: var(--dim); }
  #status b { font-variant-numeric: tabular-nums; }

  /* ---------- Bottoni flottanti ---------- */
  .fabs { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: 10px; z-index: 7; display: flex; flex-direction: column; gap: 8px; }
  .fab {
    width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--edge);
    background: var(--night); color: var(--corona); backdrop-filter: blur(10px);
    font-size: 17px; cursor: pointer; display: grid; place-items: center; text-decoration: none;
  }
  .fab:active { background: var(--raise); }
  .fab:hover { border-color: rgba(255,162,39,.58); }
  .fab:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid rgba(255,162,39,.72); outline-offset: 2px;
  }
  .fab svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .fab[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }

  /* ---------- Dock in basso ---------- */
  #dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    background: var(--night); backdrop-filter: blur(14px);
    border-top: 1px solid var(--edge);
    padding: 12px 14px calc(12px + var(--safe-b));
    display: flex; flex-direction: column; gap: 10px;
  }
  .timerow { display: flex; align-items: baseline; gap: 10px; }
  .clock { font: 700 27px/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .clock .date { font-size: 12px; font-weight: 500; color: var(--dim); margin-left: 6px; letter-spacing: 0; }
  .cover { margin-left: auto; text-align: right; font: 700 13px/1.2 var(--sans); }
  .cover span { display: block; font: 500 10px/1 var(--mono); letter-spacing: .08em; color: var(--dim); text-transform: uppercase; margin-bottom: 3px; }
  .cover.is-total { color: var(--totality); }

  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: transparent; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--amber) var(--pct, 50%), rgba(255,255,255,.16) var(--pct, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--corona); border: 3px solid var(--amber); margin-top: -11px; cursor: grab; }
  input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.16); }
  input[type=range]::-moz-range-progress { height: 5px; border-radius: 3px; background: var(--amber); }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--corona); border: 3px solid var(--amber); }

  .presets { display: flex; gap: 6px; }
  .presets button {
    flex: 1; min-height: 42px; padding: 6px 4px;
    background: var(--raise); border: 1px solid var(--edge); border-radius: 10px; color: var(--corona);
    font: 600 12px/1.25 var(--sans); cursor: pointer;
  }
  .presets button:active { background: #232a3b; }
  .presets button b { display: block; font: 700 13px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
  .presets .peak { background: rgba(255,82,82,.18); border-color: rgba(255,82,82,.5); color: #ffb3b3; }
  .presets .peak.partial { background: rgba(255,162,39,.16); border-color: rgba(255,162,39,.5); color: #ffcd8a; }
  .presets .play { flex: 0 0 46px; font-size: 15px; }

  #details { display: none; border-top: 1px solid var(--edge); padding-top: 10px; }
  #details.open { display: block; }
  #readout { font: 500 11.5px/1.6 var(--mono); font-variant-numeric: tabular-nums; color: var(--dim); }
  #readout b { color: var(--corona); font-weight: 600; }
  .toggles { display: flex; gap: 16px; margin-top: 8px; font-size: 12.5px; color: var(--dim); }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggles input { accent-color: var(--amber); width: 15px; height: 15px; }
  .overlay-feedback { margin-top: 11px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; color: var(--dim); font-size: 12.5px; }
  .overlay-feedback[hidden] { display: none; }
  .overlay-feedback button { min-width: 48px; min-height: 36px; border: 1px solid var(--edge); border-radius: 8px; background: var(--raise); color: var(--corona); font: 700 12px/1 var(--sans); cursor: pointer; }
  .overlay-feedback button[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }
  .overlay-feedback button:disabled { cursor: default; opacity: .8; }
  #feedbackThanks { color: var(--amber); }
  .privacy-link { margin-top: 9px; border: 0; padding: 0; background: none; color: var(--dim); text-decoration: underline; font: 500 11px/1.4 var(--sans); cursor: pointer; }
  /* pillola sospesa sopra la barra, sovrapposta al panorama */
  .place-pill {
    position: absolute; top: -54px; left: 50%; transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    height: 44px; padding: 0 18px; border: 0; border-radius: 999px;
    background: var(--amber); color: var(--amber-ink);
    font: 700 14px/1 var(--sans); cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  .place-pill:hover { background: #ffb347; }
  .place-pill:active { transform: translateX(-50%) scale(.97); }
  .place-pill svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .more { background: none; border: 0; color: var(--dim); font: 600 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; padding: 10px 2px; flex: none; }

  /* ---------- Sheet mappa ---------- */
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
    height: min(72vh, 560px);
    background: var(--night); backdrop-filter: blur(14px);
    border-top: 1px solid var(--edge); border-radius: 16px 16px 0 0;
    transform: translateY(101%); visibility: hidden;
    transition: transform .26s cubic-bezier(.4,0,.2,1), visibility 0s linear .26s;
    display: flex; flex-direction: column; padding-bottom: var(--safe-b);
  }
  #sheet.open { transform: translateY(0); visibility: visible; transition-delay: 0s; }
  #sheet .hd { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--edge); }
  #sheet .hd h2 { margin: 0; font-size: 14px; font-weight: 700; }
  #sheet .hd p { margin: 0; font-size: 11.5px; color: var(--dim); }
  #sheet .close { margin-left: auto; background: var(--raise); border: 1px solid var(--edge); color: var(--corona); border-radius: 8px; width: 34px; height: 34px; font-size: 16px; cursor: pointer; }
  .place-search { padding: 10px 14px; border-bottom: 1px solid var(--edge); }
  .search-row { display: flex; gap: 8px; }
  .search-row input {
    min-width: 0; flex: 1; height: 44px; padding: 0 12px;
    border: 1px solid var(--edge); border-radius: 10px;
    background: rgba(255,255,255,.07); color: var(--corona);
    /* 16px obbligatori: sotto questa soglia iOS ingrandisce la pagina al focus */
    font: 500 16px/1 var(--sans);
  }
  .search-row input::placeholder { color: #858da3; }
  .search-row button {
    height: 44px; padding: 0 13px; display: inline-flex; align-items: center; gap: 7px; flex: none;
    border: 1px solid var(--amber); border-radius: 10px;
    background: var(--amber); color: var(--amber-ink); cursor: pointer;
    font: 700 13px/1 var(--sans);
  }
  .search-row button:hover { background: #ffb347; }
  .search-row button:disabled { opacity: .6; cursor: wait; }
  .search-row svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; }
  .location-button {
    width: 100%; min-height: 44px; margin-top: 8px; padding: 0 13px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid rgba(255,162,39,.58); border-radius: 10px;
    background: rgba(255,162,39,.11); color: #ffd49a; cursor: pointer;
    font: 700 13px/1 var(--sans); touch-action: manipulation;
  }
  .location-button:hover { background: rgba(255,162,39,.2); }
  .location-button:disabled { opacity: .6; cursor: wait; }
  .location-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #searchStatus { min-height: 15px; margin: 6px 1px 0; color: var(--dim); font: 500 11px/1.35 var(--sans); }
  #searchStatus.error { color: #ff9d9d; }
  #mapArea { position: relative; flex: 1; min-height: 180px; overflow: hidden; }
  #map { position: absolute; inset: 0; }
  #mapCoach { position: absolute; z-index: 2; top: 12px; left: 12px; right: 12px; pointer-events: none; }
  #mapCoach[hidden] { display: none; }
  .coach-card {
    max-width: 330px; margin: 0 auto; padding: 11px 12px;
    display: flex; align-items: center; gap: 10px; pointer-events: auto;
    background: rgba(14,17,25,.97); border: 1px solid rgba(255,162,39,.6); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.42);
  }
  .coach-card > svg { width: 24px; height: 24px; flex: none; fill: none; stroke: var(--amber); stroke-width: 1.8; }
  .coach-card p { flex: 1; margin: 0; color: var(--corona); font: 600 12.5px/1.35 var(--sans); }
  .coach-card p span { display: block; margin-top: 2px; color: var(--dim); font-size: 11px; font-weight: 500; }
  .coach-card button { border: 0; background: transparent; color: var(--amber); padding: 8px 4px; cursor: pointer; font: 700 11px/1 var(--sans); white-space: nowrap; }
  #scrim { position: fixed; inset: 0; z-index: 7; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .26s ease; }
  #scrim.open { opacity: 1; pointer-events: auto; }

  /* ---------- Hint iniziale ---------- */
  #hint {
    position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
    bottom: calc(272px + var(--safe-b)); width: max-content; max-width: calc(100vw - 40px);
    background: var(--amber); color: var(--amber-ink); font: 600 13px/1.35 var(--sans);
    padding: 10px 14px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.45);
    transition: opacity .3s ease;
  }
  #hint.hide { opacity: 0; pointer-events: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  @media (min-width: 720px) {
    #dock { left: auto; right: 12px; bottom: 12px; width: 340px; border: 1px solid var(--edge); border-radius: 14px; padding: 14px; }
    #sheet { left: 12px; right: auto; bottom: 12px; width: 400px; height: 520px; border-radius: 14px; border: 1px solid var(--edge); }
    #hint { bottom: 24px; left: 24px; transform: none; }
    #status { left: 12px; transform: none; }
  }
  @media (max-width: 420px) {
    .search-row button span { display: none; }
    .search-row button { width: 44px; justify-content: center; padding: 0; }
  }
  @media (prefers-reduced-motion: reduce) { #sheet, #scrim, #hint { transition: none; } }
</style>

<div id="panoWrap"><div id="pano" aria-label="Street View"></div></div>
<canvas id="overlay"></canvas>

<div id="status"><span class="dot"></span><span id="statusText" data-i18n="app.loading">caricamento…</span></div>

<div class="fabs">
  <button class="fab" id="btnMap" aria-pressed="false" data-i18n-aria-label="app.map_button" data-i18n-title="app.map_button" aria-label="Scegli il punto sulla mappa" title="Scegli il punto sulla mappa">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6 5-2 8 3 5-2v13l-5 2-8-3-5 2Z"/><path d="M8 4v13M16 7v13"/></svg>
  </button>
  <button class="fab" id="btnSun" data-i18n-aria-label="app.sun_button" data-i18n-title="app.sun_button" aria-label="Guarda verso il sole" title="Guarda verso il sole">

    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5 13 3h-2L9.5 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="4"/></svg>

</div>

<div id="dock">

  </button>
  <div class="timerow">
    <div class="clock"><span id="clock">20:29</span><span class="date" data-i18n="app.date">12 ago 2026</span></div>

  <input type="range" id="slider" min="1140" max="1320" step="1" data-i18n-aria-label="app.time_aria" aria-label="Ora del giorno">

  <button class="more" id="btnMore" data-i18n="app.details_open">dettagli +</button>
  <div id="details">
    <div id="readout"></div>
    <div class="toggles">
      <label><input type="checkbox" id="tpath" checked> <span data-i18n="app.trajectory">traiettoria</span></label>
      <label><input type="checkbox" id="tmoon" checked> <span data-i18n="app.moon">luna</span></label>
      <label><input type="checkbox" id="tday"> <span data-i18n="app.whole_day">tutto il giorno</span></label>

      <span data-i18n="app.feedback_question">Il sole è allineato?</span>

      </div>
    </div>
  </div>
</div>

<script src="astronomy.browser.min.js"></script>
<script>
'use strict';
const D2R = Math.PI / 180, R2D = 180 / Math.PI, AU_KM = 1.496e8;
const $ = (s) => document.querySelector(s);
const I18N = window.EclipseI18n;
const t = (key, variables) => I18N.t(key, variables);
const fmtN = (value, digits) => I18N.formatNumber(value, digits);
const ZARAGOZA_START = { lat: 41.65704, lng: -0.87759 };
const STORAGE = {
  position: 'eclipseScout:lastPosition:v1',
  mapCoach: 'eclipseScout:mapCoach:v1',
};

function readStorage(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function writeStorage(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* private mode / blocked storage */ }
}
function loadSavedPosition() {
  try {
    const p = JSON.parse(readStorage(STORAGE.position));
    if (p && Number.isFinite(p.lat) && Number.isFinite(p.lng) && Math.abs(p.lat) <= 90 && Math.abs(p.lng) <= 180) return p;
  } catch (e) { /* ignore invalid old data */ }
  return null;
}
function savePosition(p) {
  if (p && Number.isFinite(p.lat) && Number.isFinite(p.lng)) writeStorage(STORAGE.position, JSON.stringify(p));
}

const state = {
  date: new Date('2026-08-12T20:29:40+02:00'),
  showPath: true, showMoon: true, wholeDay: false, playing: false,
  eclipse: null, eclipseKey: '', pathCache: { key: '', pts: [] },
};

/* ---------- Astronomia ---------- */
const observer = (lat, lng) => new Astronomy.Observer(lat, lng, 200);
function bodyPos(body, date, lat, lng) {
  const obs = observer(lat, lng);
  const eq = Astronomy.Equator(body, date, obs, true, true);
  const hor = Astronomy.Horizon(date, obs, eq.ra, eq.dec, 'normal');
  return { az: hor.azimuth, alt: hor.altitude, distAU: eq.dist };
}
const sunPos = (d, la, lo) => bodyPos(Astronomy.Body.Sun, d, la, lo);
const moonPos = (d, la, lo) => bodyPos(Astronomy.Body.Moon, d, la, lo);
function angularSep(a, b) {
  const a1 = a.alt * D2R, a2 = b.alt * D2R, dAz = (a.az - b.az) * D2R;
  return Math.acos(Math.min(1, Math.max(-1, Math.sin(a1) * Math.sin(a2) + Math.cos(a1) * Math.cos(a2) * Math.cos(dAz)))) * R2D;
}
const sunR = (p) => R2D * Math.asin(695700 / (p.distAU * AU_KM));
const moonR = (p) => R2D * Math.asin(1737.4 / (p.distAU * AU_KM));
function obscFrac(sep, rs, rm) {
  if (sep >= rs + rm) return 0;
  if (sep <= Math.abs(rm - rs)) return rm >= rs ? 1 : (rm * rm) / (rs * rs);
  const x = (sep * sep + rs * rs - rm * rm) / (2 * sep);
  const y = Math.sqrt(Math.max(0, rs * rs - x * x));
  const A1 = rs * rs * Math.acos(Math.min(1, Math.max(-1, x / rs))) - x * y;
  const xb = sep - x;
  const A2 = rm * rm * Math.acos(Math.min(1, Math.max(-1, xb / rm))) - xb * y;
  return (A1 + A2) / (Math.PI * rs * rs);
}
function phaseAt(date, lat, lng) {
  const s = sunPos(date, lat, lng), m = moonPos(date, lat, lng);
  const sep = angularSep(s, m), rs = sunR(s), rm = moonR(m);
  const frac = obscFrac(sep, rs, rm);
  return { s, m, sep, rs, rm, frac, phase: frac >= 1 ? 'totality' : frac > 0 ? 'partial' : 'none' };
}

}

/* La proiezione interna di StreetViewPanorama usa una focale orizzontale pari a
   (width / 2) * 2^(zoom - 1). Non equivale a supporre FOV = 180 / 2^zoom:
   coincidono solo a zoom 1, poi l'approssimazione sposta l'overlay col pitch.
   La focale dipende sempre dalla larghezza, anche in portrait. */
function focal(cam, w, h) {
  const width = w || window.innerWidth;
  const f = (width / 2) * Math.pow(2, cam.zoom - 1);
  return Number.isFinite(f) && f > 1 ? f : width;
}
function project(azDeg, altDeg, cam, w, h) {
  const az = azDeg * D2R, alt = altDeg * D2R;
  const v = [Math.cos(alt) * Math.sin(az), Math.cos(alt) * Math.cos(az), Math.sin(alt)];
  const hd = cam.heading * D2R, pt = cam.pitch * D2R;
  const fwd = [Math.sin(hd) * Math.cos(pt), Math.cos(hd) * Math.cos(pt), Math.sin(pt)];
  const right = [Math.cos(hd), -Math.sin(hd), 0];
  const up = [-Math.sin(hd) * Math.sin(pt), -Math.cos(hd) * Math.sin(pt), Math.cos(pt)];
  const d = v[0] * fwd[0] + v[1] * fwd[1] + v[2] * fwd[2];
  if (d <= 0.05) return null;
  const x = (v[0] * right[0] + v[1] * right[1] + v[2] * right[2]) / d;
  const y = (v[0] * up[0] + v[1] * up[1] + v[2] * up[2]) / d;
  const f = focal(cam, w, h);
  const px = w / 2 + x * f;
  const py = h / 2 - y * f;
  if (!Number.isFinite(px) || !Number.isFinite(py)) return null;
  return { x: px, y: py };
}

/* ---------- Disegno ---------- */
function label(text, x, y, color, size) {
  ctx.font = `700 ${size || 12}px ${getComputedStyle(document.body).fontFamily}`;
  ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.strokeText(text, x, y);
  ctx.fillStyle = color || '#f3f1ea'; ctx.fillText(text, x, y);
}
function madridParts(date) {
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
  }).formatToParts(date);
  return {
    hour: Number(parts.find((part) => part.type === 'hour').value),
    minute: Number(parts.find((part) => part.type === 'minute').value),
  };
}
const fmtT = (date) => new Intl.DateTimeFormat(I18N.locale, {
  timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit', hour12: false,
}).format(date);
function dateAtMadridMinutes(minutes, seconds) {
  const hour = String(Math.floor(minutes / 60)).padStart(2, '0');
  const minute = String(minutes % 60).padStart(2, '0');
  return new Date('2026-08-12T' + hour + ':' + minute + ':' + String(seconds || 0).padStart(2, '0') + '+02:00');
}

function getDayPath(lat, lng) {
  const day = dateAtMadridMinutes(0, 0);
  const key = '2026-08-12|' + lat.toFixed(3) + ',' + lng.toFixed(3);
  if (state.pathCache.key === key) return state.pathCache.pts;
  const pts = [];
  for (let min = 0; min < 1440; min += 5) {
    const t = new Date(day.getTime() + min * 60000);
    const s = sunPos(t, lat, lng);
    if (s.alt < -4) continue;
    let phase = 'none';
    if (state.eclipse && Math.abs(t - state.eclipse.peak.time.date) < 2.5 * 3600000) {
      const m = moonPos(t, lat, lng);
      const frac = obscFrac(angularSep(s, m), sunR(s), moonR(m));
      phase = frac >= 1 ? 'totality' : frac > 0 ? 'partial' : 'none';
    }
    pts.push({ min, az: s.az, alt: s.alt, phase });
  }
  state.pathCache = { key, pts };
  return pts;
}

function render() {
  const w = innerWidth, h = innerHeight;
  const pixelW = Math.round(w * devicePixelRatio), pixelH = Math.round(h * devicePixelRatio);
  if (canvas.width !== pixelW || canvas.height !== pixelH) {
    canvas.width = pixelW; canvas.height = pixelH;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  }
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const pos = getPos();
  if (!pos || !pano.getVisible()) return;
  updateLocalEclipse(pos.lat, pos.lng);
  const cam = getCam();
  const f = focal(cam, w, h);
  if (!Number.isFinite(f) || f <= 0) return;

  // posizioni: servono prima, per non scriverci sopra le etichette orarie
  const ph = phaseAt(state.date, pos.lat, pos.lng);
  if (!Number.isFinite(ph.s.az) || !Number.isFinite(ph.s.alt)) return;
  const ps = project(ph.s.az, ph.s.alt, cam, w, h);
  const pm = project(ph.m.az, ph.m.alt, cam, w, h);

  // orizzonte
  ctx.save();
  ctx.strokeStyle = 'rgba(243,241,234,.4)'; ctx.setLineDash([7, 7]); ctx.lineWidth = 1.4;
  ctx.beginPath();
  let on = false;
  for (let az = 0; az <= 360; az += 2) {
    const p = project(az, 0, cam, w, h);
    if (p) { on ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); on = true; } else on = false;
  }
  ctx.stroke(); ctx.restore();

  // traiettoria
  if (state.showPath) {
    const day = dateAtMadridMinutes(0, 0);
    const peakParts = state.eclipse ? madridParts(state.eclipse.peak.time.date) : null;
    const eclMin = peakParts ? peakParts.hour * 60 + peakParts.minute : null;
    let prev = null;
    ctx.lineCap = 'round';
    for (const pt of getDayPath(pos.lat, pos.lng)) {
      // di default mostro solo la finestra dell'eclissi: meno spaghetti sullo schermo
      if (!state.wholeDay && eclMin !== null && Math.abs(pt.min - eclMin) > 130) { prev = null; continue; }
      const p = project(pt.az, pt.alt, cam, w, h);
      if (p && prev && prev.p && pt.min - prev.min === 5) {
        ctx.strokeStyle = pt.phase === 'totality' ? 'rgba(255,82,82,.95)'
          : pt.phase === 'partial' ? 'rgba(255,162,39,.9)'
          : pt.alt < 0 ? 'rgba(255,162,39,.2)' : 'rgba(255,162,39,.5)';
        ctx.lineWidth = pt.phase === 'none' ? 2 : 4;
        ctx.setLineDash(pt.alt < 0 ? [4, 5] : []);
        ctx.beginPath(); ctx.moveTo(prev.p.x, prev.p.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        ctx.setLineDash([]);
      }
      if (p && pt.min % 30 === 0) {
        const t = new Date(day.getTime() + pt.min * 60000);
        ctx.fillStyle = 'rgba(243,241,234,.85)';
        ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill();
        const farFromSun = !ps || Math.hypot(p.x - ps.x, p.y - ps.y) > 75;
        if (pt.min % 60 === 0 && farFromSun) label(fmtT(t), p.x + 7, p.y - 7, 'rgba(255,205,138,.95)', 11);
      }
      prev = { min: pt.min, p };
    }
  }

  // sole e luna
  const rsRaw = f * Math.tan(ph.rs * D2R);
  const rs = Number.isFinite(rsRaw) ? Math.max(5, Math.min(200, rsRaw)) : 5;

  if (ps) {
    const isTot = ph.phase === 'totality';
    const g = ctx.createRadialGradient(ps.x, ps.y, 2, ps.x, ps.y, rs * 5);
    if (isTot) { g.addColorStop(0, 'rgba(243,241,234,.5)'); g.addColorStop(.4, 'rgba(255,140,90,.2)'); g.addColorStop(1, 'rgba(255,82,82,0)'); }
    else { g.addColorStop(0, 'rgba(255,190,90,.55)'); g.addColorStop(1, 'rgba(255,162,39,0)'); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ps.x, ps.y, rs * 5, 0, 7); ctx.fill();
    ctx.fillStyle = isTot ? '#08090f' : (ph.phase === 'partial' ? '#ffb347' : '#ffcf6b');
    ctx.beginPath(); ctx.arc(ps.x, ps.y, rs, 0, 7); ctx.fill();
    ctx.strokeStyle = isTot ? 'rgba(243,241,234,.95)' : 'rgba(255,255,255,.9)'; ctx.lineWidth = 2; ctx.stroke();
    const tag = isTot ? t('app.totality') : (ph.frac > 0 ? Math.round(ph.frac * 100) + '%' : fmtT(state.date));
    label(tag, ps.x + rs + 8, ps.y - rs - 4, isTot ? '#ff8f8f' : '#ffcd8a', 13);
    label(t('app.above_horizon', { alt: fmtN(ph.s.alt, 1) }), ps.x + rs + 8, ps.y - rs + 12, 'rgba(243,241,234,.8)', 11);
    if (ph.s.alt < 0) label(t('app.below_horizon'), ps.x + rs + 8, ps.y + rs + 4, '#ff8f8f', 11);
  }
  if (state.showMoon && pm) {
    const rmRaw = f * Math.tan(ph.rm * D2R);
    const rm = Number.isFinite(rmRaw) ? Math.max(5, Math.min(200, rmRaw)) : 5;
    ctx.fillStyle = 'rgba(20,24,36,.72)';
    ctx.beginPath(); ctx.arc(pm.x, pm.y, rm, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(180,190,215,.85)'; ctx.lineWidth = 1.4; ctx.stroke();
  }
  if (!ps && ph.s.alt > -12) {
    const dAz = ((ph.s.az - cam.heading + 540) % 360) - 180;
    const txt = dAz > 0 ? t('app.sun_right') : t('app.sun_left');
    ctx.font = '700 15px ' + getComputedStyle(document.body).fontFamily;
    const tw = ctx.measureText(txt).width;
    const bx = dAz > 0 ? w - tw - 26 : 26;
    label(txt, bx, h * 0.42, '#ffcd8a', 15);
  }
  updateUI(ph);
}

function updateLocalEclipse(lat, lng) {
  const key = lat.toFixed(2) + ',' + lng.toFixed(2);
  if (key === state.eclipseKey) return;
  state.eclipseKey = key;
  try { state.eclipse = Astronomy.SearchLocalSolarEclipse(new Date(state.date.getTime() - 3 * 86400000), observer(lat, lng)); }
  catch (e) {
    state.eclipse = null;
    trackAnalytics('application_error_detected', {
      error_code: 'astronomy_search_failed',
      component: 'astronomy',
      action: 'update_eclipse',
    });
  }
  buildPresets();
  // lo slider copre la finestra dell'eclissi con un margine
  if (state.eclipse) {
    const b = state.eclipse.partial_begin.time.date, e = state.eclipse.partial_end.time.date;
    const beginParts = madridParts(b), endParts = madridParts(e);
    slider.min = Math.max(0, beginParts.hour * 60 + beginParts.minute - 15);
    slider.max = Math.min(1439, endParts.hour * 60 + endParts.minute + 15);
    syncSlider();
  }
}

    else mk(t('app.preset_maximum'), fmtT(e.peak.time.date), 'peak partial', e.peak.time.date, true, 'maximum');

function openStreetViewAt(location, options) {
  const opts = Object.assign({ radius: 160, userInitiated: false, label: '', selectionMethod: 'map' }, options);
  const complete = () => { if (typeof opts.onComplete === 'function') opts.onComplete(); };
  const requestId = ++latestStreetViewRequest;
  if (!svService) {
    if (opts.userInitiated) {
      trackAnalytics('viewpoint_load_failed', {
        selection_method: opts.selectionMethod,
        failure_reason: 'service_unavailable',
      });
    }
    complete();
    return;
  }
  if (opts.userInitiated) setSearchStatus(t('app.street_searching'));
  svService.getPanorama({ location, radius: opts.radius, source: 'outdoor' }, (data, status) => {
    if (requestId !== latestStreetViewRequest) { complete(); return; }
    if (status === 'OK') {
      const actual = data.location.latLng;
      const p = { lat: actual.lat(), lng: actual.lng() };
      const previousPano = pano.getPano();
      const emitLoaded = () => {
        if (!opts.userInitiated || requestId !== latestStreetViewRequest) return;
        updateLocalEclipse(p.lat, p.lng);
        const ph = phaseAt(state.date, p.lat, p.lng);
        trackAnalytics('viewpoint_loaded', {
          selection_method: opts.selectionMethod,
          eclipse_kind: state.eclipse ? state.eclipse.kind : 'none',
          eclipse_phase: ph.phase,
          obscuration_percent: Math.round(ph.frac * 100),
          sun_altitude_degrees: roundMetric(ph.s.alt, 1),
        });
        resetOverlayFeedback();
      };
      if (opts.userInitiated && previousPano !== data.location.pano) {
        google.maps.event.addListenerOnce(pano, 'pano_changed', emitLoaded);
      }
      pano.setPano(data.location.pano);
      pano.setVisible(true);
      marker.setPosition(actual);
      map.setCenter(actual);
      if ((map.getZoom() || 0) < 16) map.setZoom(16);
      const sun = sunPos(state.date, p.lat, p.lng);
      pano.setPov({ heading: sun.az, pitch: Math.max(-10, Math.min(30, sun.alt + 4)) });
      savePosition(p);
      if (opts.userInitiated) {
        if (previousPano === data.location.pano) emitLoaded();
        dismissMapCoach();
        setSearchStatus(opts.label ? t('app.street_opening', { label: opts.label }) : t('app.street_found'));
        openSheet(false);
        showHint(opts.label ? t('app.street_hint', { label: opts.label }) : t('app.point_updated'), 2800);
      }
    } else if (opts.userInitiated) {
      trackAnalytics('viewpoint_load_failed', {
        selection_method: opts.selectionMethod,
        failure_reason: normalizedServiceFailure(status),
      });
      setSearchStatus(t('app.street_not_found'), true);
      showHint(t('app.street_not_found_hint'), 3400);
    }
    complete();
  });
}

$('#placeSearch').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = $('#placeQuery'), button = $('#btnSearch');
  const query = input.value.trim();
  const searchStartedAt = performance.now();
  if (!geocoder || !map) {
    setSearchStatus(t('app.maps_not_ready'), true);
    return;
  }
  if (!query) {
    trackAnalytics('place_search_completed', {
      is_successful: false,
      result_status: 'empty_query',
      query_length_bucket: 'empty',
      latency_bucket: 'under_300ms',
    });
    setSearchStatus(t('app.search_empty'), true);
    input.focus();
    return;
  }
  button.disabled = true;
  setSearchStatus(t('app.searching_query', { query }));
  const request = { address: query, region: 'es' };
  const bounds = map && map.getBounds();
  if (bounds) request.bounds = bounds;
  geocoder.geocode(request, (results, status) => {
    button.disabled = false;
    if (status !== 'OK' || !results || !results.length) {
      trackAnalytics('place_search_completed', {
        is_successful: false,
        result_status: normalizedServiceFailure(status),
        query_length_bucket: queryLengthBucket(query.length),
        latency_bucket: latencyBucket(performance.now() - searchStartedAt),
      });
      setSearchStatus(t('app.place_not_found'), true);
      return;
    }
    const result = results[0];
    trackAnalytics('place_search_completed', {
      is_successful: true,
      result_status: 'result_found',
      query_length_bucket: queryLengthBucket(query.length),
      latency_bucket: latencyBucket(performance.now() - searchStartedAt),
    });
    map.setCenter(result.geometry.location);
    map.setZoom(17);
    marker.setPosition(result.geometry.location);
    setSearchStatus(t('app.place_found'));
    openStreetViewAt(result.geometry.location, {
      radius: 300,
      userInitiated: true,
      label: result.formatted_address || query,
      selectionMethod: 'search',
    });
  });
});

$('#btnLocate').addEventListener('click', () => {
  const button = $('#btnLocate');
  const label = button.querySelector('span');
  const startedAt = performance.now();
  const finish = () => {
    button.disabled = false;
    button.removeAttribute('aria-busy');
    label.textContent = t('app.locate_button');
  };
  const fail = (status) => {
    trackAnalytics('device_location_completed', {
      is_successful: false,
      result_status: status,
      accuracy_bucket: 'unknown',
      latency_bucket: latencyBucket(performance.now() - startedAt),
    });
    setSearchStatus(locationFailureMessage(status), true);
    finish();
  };

  if (!window.isSecureContext) { fail('insecure_context'); return; }
  if (!navigator.geolocation) { fail('unsupported'); return; }
  if (!map || !marker || !svService) { fail('maps_not_ready'); return; }

  button.disabled = true;
  button.setAttribute('aria-busy', 'true');
  label.textContent = t('app.locate_busy');
  setSearchStatus(t('app.locating'));
  navigator.geolocation.getCurrentPosition((position) => {
    const coords = position && position.coords;
    const lat = coords && Number(coords.latitude);
    const lng = coords && Number(coords.longitude);
    if (!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) {
      fail('invalid_position');
      return;
    }
    const location = { lat, lng };
    const accuracy = Number(coords.accuracy);
    trackAnalytics('device_location_completed', {
      is_successful: true,
      result_status: 'position_acquired',
      accuracy_bucket: locationAccuracyBucket(accuracy),
      latency_bucket: latencyBucket(performance.now() - startedAt),
    });
    map.setCenter(location);
    map.setZoom(17);
    marker.setPosition(location);
    setSearchStatus(Number.isFinite(accuracy)
      ? t('app.position_found_accuracy', { accuracy: Math.round(accuracy) })
      : t('app.position_found'));
    label.textContent = t('app.street_busy');
    openStreetViewAt(location, {
      radius: 300,
      userInitiated: true,
      label: t('app.your_location'),
      selectionMethod: 'geolocation',
      onComplete: finish,
    });
  }, (error) => fail(locationFailureStatus(error)), {
    enableHighAccuracy: true,
    timeout: 18000,
    maximumAge: 0,
  });
});

/* punta verso il sole */
$('#btnSun').addEventListener('click', () => {
  const pos = getPos(); if (!pos) return;
  const s = sunPos(state.date, pos.lat, pos.lng);
  const pitch = Math.max(-10, Math.min(30, s.alt + 4));
  pano.setPov({ heading: s.az, pitch: pitch });
  const ph = phaseAt(state.date, pos.lat, pos.lng);
  const cam = getCam();
  trackAnalytics('sun_view_centered', {
    sun_altitude_degrees: roundMetric(s.alt, 1),
    camera_pitch_degrees: roundMetric(pitch, 1),
    camera_zoom: roundMetric(cam.zoom, 2),
    horizontal_fov_degrees: roundMetric(cam.hfov, 1),
    eclipse_phase: ph.phase,
    obscuration_percent: Math.round(ph.frac * 100),
  });
  $('#hint').classList.add('hide');
});

/* passa alla modalità AR l'istante assoluto scelto: la posizione arriva dal GPS */
$('#btnCamera').addEventListener('click', (event) => {
  const target = new URL('ar.html', location.href);
  target.searchParams.set('t', state.date.toISOString());
  target.searchParams.set('lang', I18N.language);
  event.currentTarget.href = target.href;
});

/* ---------- Init ---------- */
function initApp() {
  const start = loadSavedPosition() || ZARAGOZA_START;
  openSheet(false, null, false);
  pano = new google.maps.StreetViewPanorama($('#pano'), {
    position: start, pov: { heading: 285, pitch: 4 }, zoom: 1,
    motionTracking: false, fullscreenControl: false, addressControl: false,
    linksControl: true, panControl: false, zoomControl: false, enableCloseButton: false,
  });
  map = new google.maps.Map($('#map'), {
    center: start, zoom: 16, streetViewControl: true, mapTypeControl: false,
    fullscreenControl: false, clickableIcons: false,
    styles: [{ elementType: 'geometry', stylers: [{ saturation: -30 }] }],
  });
  map.setStreetView(pano);
  svService = new google.maps.StreetViewService();
  geocoder = new google.maps.Geocoder();
  marker = new google.maps.Marker({ map, position: start, title: t('app.marker_title') });

  map.addListener('click', (ev) => {
    openStreetViewAt(ev.latLng, { radius: 120, userInitiated: true });
  });

  ['pov_changed', 'zoom_changed', 'pano_changed', 'position_changed', 'visible_changed'].forEach((ev) => pano.addListener(ev, render));
  pano.addListener('position_changed', () => {
    const p = getPos();
    if (p && marker) {
      marker.setPosition(p);
      clearTimeout(savePositionTimer);
      savePositionTimer = setTimeout(() => savePosition(p), 350);
    }
  });
  addEventListener('resize', render);
  syncSlider();
  render();
  openStreetViewAt(start, { radius: 180 });
  setTimeout(() => $('#hint').classList.add('hide'), 7000);
}
window.gm_authFailure = function () {
  trackAnalytics('application_error_detected', {
    error_code: 'maps_auth_failed',
    component: 'google_maps',
    action: 'initialize',
  });
  setSearchStatus(t('app.maps_blocked'), true);
  showHint(t('app.maps_blocked_hint'), 5000);
  $('#btnSearch').disabled = true;
  $('#btnLocate').disabled = true;
};
window.mapsScriptLoadFailed = function () {
  trackAnalytics('application_error_detected', {
    error_code: 'maps_script_load_failed',
    component: 'google_maps',
    action: 'load_script',
  });
  setSearchStatus(t('app.maps_load_failed'), true);
  showHint(t('app.maps_load_hint'), 5000);
  $('#btnSearch').disabled = true;
  $('#btnLocate').disabled = true;
};
window.initApp = initApp;
function loadGoogleMaps() {
  const script = document.createElement('script');
  script.async = true;
  script.dataset.googleMaps = '';
  script.onerror = window.mapsScriptLoadFailed;
  const params = new URLSearchParams({
    key: 'AIzaSyBcnYkcvoYx5I5qQZb1oRaUTy_VmMb2DNU',
    callback: 'initApp',
    v: 'quarterly',
    language: I18N.googleMapsLanguage(),
    region: 'ES',
    loading: 'async',
  });
  script.src = 'https://maps.googleapis.com/maps/api/js?' + params.toString();
  document.body.appendChild(script);
}
loadGoogleMaps();
</script>
